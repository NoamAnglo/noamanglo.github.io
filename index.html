<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noam</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f2;
      --ink: #1c1b19;
      --muted: #5c5852;
      --line: #e4e0d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      line-height: 1.6;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0 0 2.5rem;
      color: var(--muted);
      font-size: 1.15rem;
    }

    section + section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    p {
      margin: 0;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Noam</h1>
    <p class="lede">Portfolio</p>

    <section>
      <h2>About</h2>
      <p>Student. This is the start of my site.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <p><a href="https://github.com/nanglo">github.com/nanglo</a></p>
    </section>
  </main>
</body>
</html>
